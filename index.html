<!DOCTYPE html>
<html>
<head>
  <title>todo app</title>
  <link 
    href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
    rel="stylesheet"
  >
  <link
    rel="stylesheet"
    href="style.css"
    media="screen"
    charset="utf-8"
  >
</head>
<body class="body">
  <div class="header">
    <img src="./eisenhower-matrix.jpg" class="header-img">
    <a 
      class="more-info"
      href="https://goal-life.com/page/method/matrix-eisenhower"
    >want more details?</a>
  </div>
  <div class="main">
    <p id="add-task">
      <label for="new-task" class="label heading">add item</label>
      <div class="task-row-wrapper">
        <input id="new-task"class="task" type="text">
        <button class="button">add</button>
      </div>
    </p>
    <h3 class="heading">todo</h3>
    <ul id="incomplete-tasks">
      <li class="todo-item">
        <input type="checkbox" class="checkbox">
        <label class="task label">pay bills</label>
        <input type="text" class="task input-text">
        <button class="edit button">edit</button>
        <button class="delete button">
          <img src="./remove.svg" class="icon">
        </button>
      </li>
      <li class="edit-mode todo-item">
        <input type="checkbox" class="checkbox">
        <label class="task label">go shopping</label>
        <input type="text" value="go shopping" class="task input-text">
        <button class="edit button">save</button>
        <button class="delete button">
          <img src="./remove.svg" class="icon">
        </button>
      </li>
    </ul>
    <h3 class="heading">completed</h3>
    <ul id="completed-tasks">
      <li class="todo-item">
        <input type="checkbox" checked class="checkbox">
        <label class="task label">see the doctor</label>
        <input type="text" class="task input-text">
        <button class="edit button">edit</button>
        <button class="delete button">
          <img src="./remove.svg" class="icon">
        </button>
      </li>
    </ul>
  </div>
  <script src="app.js"></script>
</body>
</html>
